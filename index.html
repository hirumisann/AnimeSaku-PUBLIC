<!doctype html>
<html lang="id" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="theme-color" content="#000000" />
    <link
      rel="icon"
      href="https://i.ibb.co.com/LXLCMZb5/Screenshot-2026-04-26-202313.png"
      type="image/x-icon"
    />
    <title>AnimeSaku - Anime Di Dalam Saku</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Quicksand:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <!-- Top Header -->
    <header class="app-header" id="appHeader">
      <div class="header-inner">
        <button class="icon-btn back-btn" id="backBtn" aria-label="Back">
          <svg
            viewBox="0 0 24 24"
            width="22"
            height="22"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <polyline points="15 18 9 12 15 6"></polyline>
          </svg>
        </button>
        <a href="#/home" class="brand">
          <span class="brand-text"
            >Anime<span class="brand-accent">Saku</span></span
          >
        </a>
        <div class="header-actions">
          <button
            class="icon-btn theme-toggle-btn"
            id="themeToggleBtn"
            aria-label="Toggle Theme"
          >
            <svg
              class="icon-sun"
              viewBox="0 0 24 24"
              width="20"
              height="20"
              fill="none"
              stroke="currentColor"
              stroke-width="2.2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <circle cx="12" cy="12" r="5"></circle>
              <line x1="12" y1="1" x2="12" y2="3"></line>
              <line x1="12" y1="21" x2="12" y2="23"></line>
              <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
              <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
              <line x1="1" y1="12" x2="3" y2="12"></line>
              <line x1="21" y1="12" x2="23" y2="12"></line>
              <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
              <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
            </svg>
            <svg
              class="icon-moon"
              viewBox="0 0 24 24"
              width="20"
              height="20"
              fill="none"
              stroke="currentColor"
              stroke-width="2.2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
          </button>
          <button
            class="icon-btn search-icon-btn"
            id="headerSearchBtn"
            aria-label="Search"
          >
            <svg
              viewBox="0 0 24 24"
              width="22"
              height="22"
              fill="none"
              stroke="currentColor"
              stroke-width="2.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
          </button>
        </div>
      </div>
    </header>

    <!-- Splash Screen -->
    <div class="splash-screen" id="splashScreen">
      <div class="splash-inner">
        <div class="splash-logo">
          <div class="splash-logo-icon">
            <img
              src="https://i.ibb.co.com/LXLCMZb5/Screenshot-2026-04-26-202313.png"
              alt="AnimeSaku Logo"
              class="splash-logo-img"
            />
          </div>
          <div class="splash-brand">
            <span class="splash-brand-text">Anime</span
            ><span class="splash-brand-accent">Saku</span>
          </div>
        </div>
        <div class="splash-loader">
          <div class="splash-loader-ring"></div>
          <div class="splash-loader-ring"></div>
          <div class="splash-loader-ring"></div>
        </div>
        <p class="splash-tagline">Anime Di Dalam Saku</p>
      </div>
    </div>

    <!-- Main Content -->
    <main class="app-main" id="appMain"></main>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav" id="bottomNav">
      <a href="#/home" class="nav-item" data-route="home">
        <svg
          viewBox="0 0 24 24"
          width="20"
          height="20"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
          <polyline points="9 22 9 12 15 12 15 22"></polyline>
        </svg>
        <span>Home</span>
      </a>
      <a href="#/schedule" class="nav-item" data-route="schedule">
        <svg
          viewBox="0 0 24 24"
          width="20"
          height="20"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
          <line x1="16" y1="2" x2="16" y2="6"></line>
          <line x1="8" y1="2" x2="8" y2="6"></line>
          <line x1="3" y1="10" x2="21" y2="10"></line>
        </svg>
        <span>Jadwal</span>
      </a>
      <a href="#/downloads" class="nav-item" data-route="downloads">
        <svg
          viewBox="0 0 24 24"
          width="20"
          height="20"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
          <polyline points="7 10 12 15 17 10"></polyline>
          <line x1="12" y1="15" x2="12" y2="3"></line>
        </svg>
        <span>Download</span>
      </a>
      <a href="#/chat" class="nav-item" data-route="chat">
        <svg
          viewBox="0 0 24 24"
          width="20"
          height="20"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path
            d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"
          ></path>
        </svg>
        <span>Chat</span>
      </a>
      <a href="#/settings" class="nav-item" data-route="settings">
        <svg
          viewBox="0 0 24 24"
          width="20"
          height="20"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <circle cx="12" cy="8" r="4"></circle>
          <path d="M20 21a8 8 0 1 0-16 0"></path>
        </svg>
        <span>Profil</span>
      </a>
    </nav>

    <!-- Category Filter Drawer -->
    <div class="drawer-overlay" id="drawerOverlay"></div>
    <div class="genre-drawer" id="genreDrawer">
      <div class="drawer-header">
        <h3>🎯 Filter Genre</h3>
        <button class="drawer-close" id="drawerClose">
          <svg
            viewBox="0 0 24 24"
            width="22"
            height="22"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
          >
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
      <div class="drawer-body" id="drawerGenreOptions"></div>
      <div class="drawer-footer">
        <button class="btn btn-outline drawer-reset" id="drawerReset">
          Reset
        </button>
        <button class="btn drawer-apply" id="drawerApply">
          <svg
            viewBox="0 0 24 24"
            width="16"
            height="16"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
          >
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
          Tampilkan
        </button>
      </div>
    </div>

    <!-- Modal Popup -->
    <div class="modal-overlay" id="modalOverlay">
      <div class="modal-box" id="modalBox">
        <div class="modal-header">
          <h3 id="modalTitle"></h3>
          <button class="modal-close" id="modalClose">
            <svg
              viewBox="0 0 24 24"
              width="20"
              height="20"
              fill="none"
              stroke="currentColor"
              stroke-width="2.5"
              stroke-linecap="round"
            >
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>
        <div class="modal-body" id="modalBody"></div>
      </div>
    </div>

    <!-- Floating Download Progress Bar -->
    <div class="dl-floating-bar" id="dlFloatingBar">
      <div class="dl-floating-info">
        <span class="dl-floating-text" id="dlFloatingText">Mengunduh...</span>
        <span class="dl-floating-count" id="dlFloatingCount">0/0</span>
      </div>
      <div class="dl-progress-bar">
        <div
          class="dl-progress-fill"
          id="dlFloatingFill"
          style="width: 0%"
        ></div>
      </div>
    </div>

    <script src="./script.js"></script>
  </body>
</html>
